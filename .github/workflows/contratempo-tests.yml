name: Testar sala de ensaio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
  navegador:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.55.0
      - if: matrix.browser == 'firefox'
        run: python -m playwright install firefox
      - run: python tests/browser.py
        env:
          CONTRATEMPO_ENGINE: ${{ matrix.browser }}
          CONTRATEMPO_BROWSER: ${{ matrix.browser == 'chromium' && 'google-chrome' || '' }}
          CAPTURAR_DEMO: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.browser }}
          path: capturas/*.png
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(v2026.11.21)')
    needs: [python, navegador]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publicar marco testado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2026.11.21 --target "$GITHUB_SHA" --title "Atualização de 21 de novembro" --notes-file RELEASE.md

