<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contracanto · sala de ensaio</title>
<style>
:root{color-scheme:dark;background:#102731;color:#fbf1df;font:17px/1.55 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:auto;max-width:56rem;padding:clamp(1rem,5vw,4rem)}
header,footer{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #60818a;padding:1rem 0;gap:1rem;flex-wrap:wrap}
header b{letter-spacing:.09em}header a,footer a{color:#ffbc86}
h1{font:normal clamp(2.5rem,8vw,5rem)/1 Georgia,serif;margin:2rem 0 1rem}
#current{font:normal clamp(1.8rem,5vw,3.7rem)/1.1 Georgia,serif;margin:.45rem 0;overflow-wrap:anywhere}
#next,small{color:#c2d0d1}.stage{border-left:4px solid #ffae76;padding:.5rem 1.2rem;margin:2rem 0}
audio{width:100%;margin:.5rem 0 1rem}select,input,button{font:inherit;max-width:100%}
.tools{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.tools label{display:grid;gap:.35rem}
ol{padding-left:0;list-style:none}li button{padding:.65rem .25rem;width:100%;text-align:left;color:inherit;background:transparent;border:0;border-bottom:1px solid #42606a;cursor:pointer}
li button[aria-current=true]{color:#ffbc86}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbc86}
time{font: .86rem monospace;color:#afc4c6;margin-right:1rem}
</style>
<header><b>CONTRACANTO</b><a href="https://github.com/ykauttiz/discord-lyrics-sync">Código no GitHub ↗</a></header>
<main><h1 id="title"></h1>
<div class="stage"><small>Verso atual</small><p id="current"></p><p id="next"></p></div>
<audio id="audio" controls preload="metadata"></audio>
<div class="tools"><label>Usar áudio local<input id="upload" type="file" accept="audio/*"></label>
<label>Velocidade<select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label></div>
<p id="status" role="status"></p><h2>Versos</h2><ol id="lines"></ol></main>
<footer><small>O arquivo de áudio escolhido fica no navegador.</small></footer>
<script id="score" type="application/json">{"lines": [[0, "O farol riscou a rua"], [3.0, "A chuva ficou pra trás"], [6.0, "Na curva da madrugada"], [9.0, "Teu áudio tocou mais uma vez"], [12.0, ""]], "title": "Depois da chuva", "audio": "ensaio.mp3"}</script>
<script>
const score = JSON.parse(document.querySelector("#score").textContent);
const audio = document.querySelector("#audio");
const statusText = document.querySelector("#status");
const speed = document.querySelector("#speed");
let localUrl, selected = -2;
document.querySelector("#title").textContent = score.title;
const buttons = score.lines.map(([at, line]) => {
  const row = document.createElement("li");
  const button = document.createElement("button");
  const stamp = document.createElement("time");
  stamp.textContent = Math.floor(at / 60) + ":" + String(Math.floor(at % 60)).padStart(2,"0");
  button.append(stamp, line || "Pausa");
  button.onclick = () => {
    if (audio.readyState < 1) {statusText.textContent = "Selecione um áudio e aguarde o carregamento.";return;}
    audio.currentTime = Math.min(at, audio.duration);
    render();
  };
  row.append(button);
  document.querySelector("#lines").append(row);
  return button;
});
function render() {
  let low = 0, high = score.lines.length;
  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (score.lines[mid][0] <= audio.currentTime) low = mid + 1;
    else high = mid;
  }
  const index = low - 1;
  if (index === selected) return;
  buttons[selected]?.removeAttribute("aria-current");
  buttons[index]?.setAttribute("aria-current","true");
  document.querySelector("#current").textContent = score.lines[index]?.[1] || "♪";
  const next = score.lines[index + 1]?.[1];
  document.querySelector("#next").textContent = next ? "A seguir · " + next : "";
  selected = index;
}
for (const event of ["timeupdate","seeked","loadedmetadata","ended"]) audio.addEventListener(event, render);
audio.addEventListener("loadedmetadata", () => {audio.playbackRate = Number(speed.value);});
audio.addEventListener("error", () => {statusText.textContent = "O navegador não conseguiu abrir o áudio. Experimente outro arquivo.";});
speed.onchange = () => {audio.playbackRate = Number(speed.value);};
document.querySelector("#upload").onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (localUrl) URL.revokeObjectURL(localUrl);
  localUrl = URL.createObjectURL(file);
  audio.src = localUrl;
  statusText.textContent = file.name;
};
if (score.audio) audio.src = score.audio;
else statusText.textContent = "Escolha a gravação correspondente a esta letra.";
render();
</script></html>
